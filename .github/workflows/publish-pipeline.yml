name: Build and Publish
run-name: Build and Publish – ${{ github.ref_name }}

on:
  push:
    branches: ["**"]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  pipeline:
    uses: ./.github/workflows/publish.yml
    with:
      working-directory: bridge-angular
      install-command: 'npm install'
      build-command: 'npm run build'
      # ng-packagr writes the library to bridge-angular/dist; the source folder
      # above it is not importable (TBP-744).
      publish-directory: dist
      pack-check-command: node "$GITHUB_WORKSPACE/scripts/check-pack.mjs" .
      setup-bun: false
